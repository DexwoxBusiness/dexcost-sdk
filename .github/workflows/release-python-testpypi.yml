name: Release Python (TestPyPI dry-run)

# Dry-run publish of the Python SDK to TestPyPI via Trusted Publishing (OIDC) —
# no API token stored. Use this to validate the full release flow (build, metadata,
# project page render, install) BEFORE the real PyPI release.
#
# Triggered by pushing a tag of the form `python-test/vX.Y.Z`, e.g.:
#   git tag python-test/v0.1.0
#   git push origin python-test/v0.1.0
# (Re-runnable: bump to v0.1.0.dev1, v0.1.0.dev2, … since a version can't be
#  uploaded twice, even on TestPyPI.)
#
# One-time setup on TestPyPI (https://test.pypi.org/manage/account/publishing/):
#   Add a "pending publisher" with:
#     PyPI Project Name: dexcost
#     Owner:             DexwoxBusiness
#     Repository:        dexcost-sdk
#     Workflow name:     release-python-testpypi.yml
#     Environment:       testpypi
#
# After a successful run, install (deps resolved from real PyPI) with:
#   pip install --index-url https://test.pypi.org/simple/ \
#               --extra-index-url https://pypi.org/simple/ dexcost

on:
  push:
    tags:
      - "python-test/v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python release (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      CUSTOM_TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify complete release suite
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install pytest pytest-asyncio mypy==2.3.1 ruff==0.16.4
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
          python -m ruff check src
          python -m mypy src
          python scripts/freeze_contract.py --check
          python -m pytest tests/ -q

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-testpypi
          path: python/dist/

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist-testpypi
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
