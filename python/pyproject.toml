[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexcost"
version = "0.20.0"
description = "Agent Unit Economics SDK — track end-to-end business-task costs for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dexwox Innovations" },
]
keywords = ["ai", "agents", "cost-tracking", "llm", "observability", "unit-economics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "wrapt>=1.16",
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "cryptography>=42.0",
]

[project.optional-dependencies]
crewai = [
    # CrewAI currently declares Python <3.14. Keep the core SDK available on
    # 3.14 while allowing the integration extra to become active as soon as
    # upstream publishes a compatible release and this marker is reviewed.
    "crewai>=1.0; python_version < '3.14'",
    # CrewAI -> ChromaDB 1.1.x permits onnxruntime>=1.14.1, but
    # onnxruntime 1.24+ no longer publishes CPython 3.10 wheels. Constrain the
    # transitive dependency only on 3.10 so the advertised release matrix stays
    # installable while newer interpreters retain the current runtime line.
    "onnxruntime>=1.14.1,<1.24; python_version < '3.11'",
]
griptape = [
    "griptape>=1.0",
]
openai = [
    "openai>=1.0,<3.0",
]
anthropic = [
    "anthropic>=0.18,<1.0",
]
litellm = [
    # LiteLLM 1.97.0 declares Python 3.10 support, but its ModelResponse models
    # retain unresolved Pydantic forward references on a clean 3.10 install.
    # 1.96.2 is the last version verified by the real-response compatibility
    # suite, so keep the upper bound exact instead of admitting 1.97.x.
    "litellm>=1.0,<=1.96.2; python_version < '3.11'",
    "litellm>=1.0,<2.0; python_version >= '3.11'",
]
gemini = [
    "google-genai>=1.0,<3.0.0",
]
bedrock = [
    "boto3>=1.34,<2.0",
    "aws_sdk_bedrock_runtime>=0.2,<0.3; python_version >= '3.12'",
]
cohere = [
    "cohere>=5.0,<6.0",
]
mcp = [
    "mcp>=1.0,<2.0",
]
ollama = [
    "ollama>=0.6,<1.0",
]
openrouter = [
    "openrouter>=1.0,<2.0",
]
perplexity = [
    "perplexityai>=0.43,<2.0",
]
fal = [
    "fal-client>=0.14,<1.0",
]
gpu = [
    # NVIDIA publishes pynvml under nvidia-ml-py. Keep the supported major
    # bounded because NVML binding majors may remove deprecated APIs.
    "nvidia-ml-py>=12.535,<14.0",
]
all = [
    "openai>=1.0,<3.0",
    "anthropic>=0.18,<1.0",
    "litellm>=1.0,<=1.96.2; python_version < '3.11'",
    "litellm>=1.0,<2.0; python_version >= '3.11'",
    "google-genai>=1.0,<3.0.0",
    "boto3>=1.34,<2.0",
    "aws_sdk_bedrock_runtime>=0.2,<0.3; python_version >= '3.12'",
    "cohere>=5.0,<6.0",
    "mcp>=1.0,<2.0",
    "ollama>=0.6,<1.0",
    "openrouter>=1.0,<2.0",
    "perplexityai>=0.43,<2.0",
    "fal-client>=0.14,<1.0",
    "nvidia-ml-py>=12.535,<14.0",
    "crewai>=1.0; python_version < '3.14'",
    "onnxruntime>=1.14.1,<1.24; python_version < '3.11'",
    "griptape>=1.0",
]

[project.scripts]
dexcost = "dexcost.cli:main"

[project.urls]
Homepage = "https://github.com/DexwoxBusiness/dexcost-sdk"
Documentation = "https://docs.dexcost.io/docs/sdks/python"
Repository = "https://github.com/DexwoxBusiness/dexcost-sdk"
Issues = "https://github.com/DexwoxBusiness/dexcost-sdk/issues"
Changelog = "https://github.com/DexwoxBusiness/dexcost-sdk/blob/main/python/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatch build
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/dexcost"]

# Non-Python assets. Files under ``src/dexcost`` (``data/*.json``,
# ``adapters/data/*.json``, ``attribution/attribution-v3-schema.json``) ship with
# the package automatically. The Standard Event Schema v1 documents live beside
# the package in ``schemas/``, so they are force-included into ``dexcost/schemas``
# — without this, ``dexcost.validate()`` has no schema to validate against in a
# wheel install.
[tool.hatch.build.targets.wheel.force-include]
"schemas/dexcost-event.v1.json" = "dexcost/schemas/dexcost-event.v1.json"
"schemas/dexcost-task.v1.json" = "dexcost/schemas/dexcost-task.v1.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/dexcost",
    "schemas",
    "tests",
    "fixtures",
    "README.md",
    "FRAMEWORK-COMPATIBILITY.md",
    "PROVIDER-COMPATIBILITY.md",
    "CHANGELOG.md",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["dexcost"]

# ---------------------------------------------------------------------------
# Black (formatter)
# ---------------------------------------------------------------------------
[tool.black]
target-version = ["py310"]
line-length = 99

# ---------------------------------------------------------------------------
# Mypy (type checker — strict mode)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["wrapt", "wrapt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NumPy is a transitive optional-provider dependency, not part of DexCost's
# public typing boundary. Current NumPy stubs use Python 3.12 ``type`` syntax,
# which a strict Mypy run targeting the supported Python 3.10 floor cannot
# parse. Skip following that third-party implementation while continuing to
# type-check every DexCost source module strictly.
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["crewai", "crewai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["griptape", "griptape.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.*", "google.genai", "google.genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["botocore", "botocore.*", "boto3", "boto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "aws_sdk_bedrock_runtime",
    "aws_sdk_bedrock_runtime.*",
    "smithy_aws_core",
    "smithy_aws_core.*",
    "smithy_core",
    "smithy_core.*",
    "smithy_http",
    "smithy_http.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cohere", "cohere.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["click", "click.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiohttp", "aiohttp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["urllib3", "urllib3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dexcost.cli"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
